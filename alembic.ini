; Alembic configuration.
;
; `sqlalchemy.url` is deliberately absent. The URL is a credential — `migrations/env.py`
; reads it from `Settings.DATABASE_URL`, which is the same configuration contract the
; application uses, so a migration can never run against a database the application is not
; pointed at, and no connection string is committed.
;
; `file_template` puts the revision id first so `ls versions/` is in apply order, and keeps
; the slug so a revision is identifiable without opening it.

[alembic]
script_location = migrations
prepend_sys_path = src
file_template = %%(rev)s_%%(slug)s
timezone = UTC
version_path_separator = os
path_separator = os

; Long-lived locks are what turn a migration into an outage. `lock_timeout` makes PostgreSQL
; abort a statement that cannot take its lock rather than queue every subsequent query behind
; it; `statement_timeout` bounds the ones that did take it. `migrations/env.py` emits both,
; and `migration_lint.require_lock_budget` fails the build if the emitted script has no
; lock budget at all. [persistence.md 9 — "a migration exceeding its lock budget is aborted"]
[migration]
lock_timeout_ms = 5000
statement_timeout_ms = 300000

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
