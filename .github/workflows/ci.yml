name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --frozen
      - name: Lint
        run: make lint

  type:
    name: type
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --frozen
      - name: Type check
        run: make type

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --frozen
      - name: Assert the Python floor
        run: uv run python -c "import sys; assert sys.version_info[:2] == (3, 12), sys.version"
      # The startup preflight validates configuration, so the entrypoint test needs a .env.
      # Copying the template rather than writing one asserts something worth asserting: the
      # committed template is by itself sufficient to boot the process. Every credential in it
      # is blank, so nothing here is a secret.
      - name: Materialise .env from the committed template
        run: cp .env.example .env
      - name: Test
        run: make test
