name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --frozen
      - name: Lint
        run: make lint

  # `make lint` and the pre-commit hooks are two gate sets over one tree, and they had
  # already diverged: hooks that `make lint` does not run (end-of-file-fixer,
  # mixed-line-ending, detect-private-key) were failing on committed files with nothing in
  # CI to notice. S0.1.2 AC4 requires this to exit 0, so CI must be the thing that says so.
  pre-commit:
    name: pre-commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --frozen
      - name: Run every hook over the whole tree
        run: uv run pre-commit run --all-files --show-diff-on-failure

  type:
    name: type
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --frozen
      - name: Type check
        run: make type

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --frozen
      - name: Assert the Python floor
        run: uv run python -c "import sys; assert sys.version_info[:2] == (3, 12), sys.version"
      # The startup preflight validates configuration, so the entrypoint test needs a .env.
      # Copying the template rather than writing one asserts something worth asserting: the
      # committed template is by itself sufficient to boot the process. Every credential in it
      # is blank, so nothing here is a secret.
      - name: Materialise .env from the committed template
        run: cp .env.example .env
      - name: Test
        run: make test
